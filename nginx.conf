worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream api {
        server api1:9999;
        server api2:9999;
        keepalive 100;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
