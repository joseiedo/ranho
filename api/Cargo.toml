[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
monoio = { version = "0.2", features = ["iouring", "legacy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3"
