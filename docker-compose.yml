services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "30MB"
    networks:
      - rinha

  api1:
    image: ghcr.io/joseiedo/rinha-de-backend-2026:latest
    environment:
      INDEX_PATH: /app/resources/index.bin
      LISTEN_ADDR: "0.0.0.0:3000"
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"
    networks:
      - rinha

  api2:
    image: ghcr.io/joseiedo/rinha-de-backend-2026:latest
    environment:
      INDEX_PATH: /app/resources/index.bin
      LISTEN_ADDR: "0.0.0.0:3000"
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
