x-api: &api
  image: rinha-2026:local
  environment:
    INDEX_PATH: /app/resources/index.bin
  ulimits:
    nofile: 65535
  deploy:
    resources:
      limits:
        cpus: "0.40"
        memory: "160MB"
  networks:
    - rinha

services:
  api1:
    <<: *api
    environment:
      INDEX_PATH: /app/resources/index.bin
      LISTEN_ADDR: "0.0.0.0:3000"

  api2:
    <<: *api
    environment:
      INDEX_PATH: /app/resources/index.bin
      LISTEN_ADDR: "0.0.0.0:3000"

  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "30MB"
    networks:
      - rinha

networks:
  rinha:
