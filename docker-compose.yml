services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sock:/run/sock
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "30MB"
    networks:
      - rinha

  api1:
    image: ghcr.io/joseiedo/rinha-de-backend-2026:latest
    environment:
      INDEX_PATH: /app/resources/index.bin
      SOCKET_PATH: /run/sock/api1.sock
    volumes:
      - sock:/run/sock
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"
    networks:
      - rinha

  api2:
    image: ghcr.io/joseiedo/rinha-de-backend-2026:latest
    environment:
      INDEX_PATH: /app/resources/index.bin
      SOCKET_PATH: /run/sock/api2.sock
    volumes:
      - sock:/run/sock
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"
    networks:
      - rinha

volumes:
  sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  rinha:
    driver: bridge
