x-api: &api
  image: ghcr.io/joseiedo/rinha-de-backend-2026:v0.0.10
  environment:
    INDEX_PATH: /app/resources/index.bin
  deploy:
    resources:
      limits:
        cpus: "0.40"
        memory: "160MB"
  networks:
    - rinha

services:
  api1:
    <<: *api
    environment:
      INDEX_PATH: /app/resources/index.bin

  api2:
    <<: *api
    environment:
      INDEX_PATH: /app/resources/index.bin

  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "30MB"
    networks:
      - rinha

networks:
  rinha:
