x-api: &api
  image: ghcr.io/joseiedo/rinha-de-backend-2026:latest
  environment:
    INDEX_PATH: /app/resources/index.bin
  volumes:
    - sock:/run/sock
  ulimits:
    nofile: 65535
  deploy:
    resources:
      limits:
        cpus: "0.40"
        memory: "160MB"
  networks:
    - rinha

services:
  api1:
    <<: *api
    environment:
      INDEX_PATH: /app/resources/index.bin
      SOCKET_PATH: /run/sock/api1.sock

  api2:
    <<: *api
    environment:
      INDEX_PATH: /app/resources/index.bin
      SOCKET_PATH: /run/sock/api2.sock

  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sock:/run/sock
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "30MB"
    networks:
      - rinha

volumes:
  sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  rinha:
