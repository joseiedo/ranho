x-api: &api
  image: rinha-2026:local
  ulimits:
    nofile: 65535
  volumes:
    - sockets:/sockets
  deploy:
    resources:
      limits:
        cpus: "0.40"
        memory: "160MB"

services:
  api1:
    <<: *api
    environment:
      INDEX_PATH: /app/resources/index.bin
      SOCKET_PATH: /sockets/api1.sock

  api2:
    <<: *api
    environment:
      INDEX_PATH: /app/resources/index.bin
      SOCKET_PATH: /sockets/api2.sock

  haproxy:
    image: haproxy:3.0-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "30MB"

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
