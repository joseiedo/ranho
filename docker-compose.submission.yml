services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "30MB"
    networks:
      - rinha

  api1:
    image: ghcr.io/joseiedo/rinha-de-backend-2026:latest
    environment:
      INDEX_PATH: /app/resources/index.bin
      MCC_RISK_PATH: /app/resources/mcc_risk.json
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9999/ready"]
      interval: 3s
      timeout: 2s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "155MB"
    networks:
      - rinha

  api2:
    image: ghcr.io/joseiedo/rinha-de-backend-2026:latest
    environment:
      INDEX_PATH: /app/resources/index.bin
      MCC_RISK_PATH: /app/resources/mcc_risk.json
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9999/ready"]
      interval: 3s
      timeout: 2s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "155MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
